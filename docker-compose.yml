services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-desk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desk}
      POSTGRES_DB: ${POSTGRES_DB:-desk}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Separate throwaway database for pytest, so tests never touch dev data.
  db_test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-desk}:${POSTGRES_PASSWORD:-desk}@db:5432/${POSTGRES_DB:-desk}
      TEST_DATABASE_URL: postgresql+psycopg://test:test@db_test:5432/test
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Dev-only default so `docker compose up` works from a clean clone. Set a real secret in .env for any shared deployment.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Mount the code so `docker compose run --rm api pytest` sees edits without a rebuild.
      - ./backend:/app
      - ./seed:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The React app, served by nginx. nginx also forwards /api/* to the api service.
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Checks nginx and its proxy to the API in one go. 127.0.0.1, not localhost:
      # inside the container localhost resolves to IPv6 ::1 first, and nginx listens on IPv4.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
