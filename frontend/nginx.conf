server {
    listen 80;

    # The React app.
    root /usr/share/nginx/html;
    location / {
        try_files $uri /index.html;
    }

    # The API, on the same origin so the browser needs no CORS.
    # "/api/requests" is forwarded as "/requests".
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100m;  # CSV imports, same limit as the API
    }
}
