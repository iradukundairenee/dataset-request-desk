# Runs the same commands a reviewer runs locally (see README), so CI also proves
# that the stack starts from a clean clone.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build images (backend + frontend, including the TypeScript check)
        run: docker compose build

      - name: Run backend tests against a real Postgres
        run: docker compose run --rm api pytest -q

      - name: Start the whole stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test through the frontend's nginx proxy
        run: |
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/api/health
          # the seed users exist and can log in
          curl --fail --silent -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"admin123"}' \
            http://localhost:8080/api/auth/login > /dev/null

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
